# Render.com ile tek tıkla kurulum (New > Blueprint > bu depoyu seçin).
# Randevuların kalıcı olması için disk gerekir; disk yalnızca ücretli planlarda vardır.
services:
  - type: web
    name: ark-dental-asistan
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_FILE
        value: /var/data/appointments.json
    disk:
      name: randevular
      mountPath: /var/data
      sizeGB: 1
