<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARK Dental Clinic · Kaptan Ark Asistan</title>
  <meta name="description" content="ARK Dental Clinic asistanı Kaptan Ark: sorularınızı yanıtlar, randevu talebinizi oluşturur.">
  <meta name="theme-color" content="#0f8c8f">
  <link rel="icon" type="image/png" href="img/mascot-640.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/mascot-body.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9.5 3.5c2.6 0 4.2 1.3 6.5 1.3s3.9-1.3 6.5-1.3c4.3 0 6.9 3.4 6.9 7.8 0 3.7-1.4 6.4-2.6 9.5-1.2 3.3-1.6 7.7-4.3 7.7-2.9 0-2.6-6.6-6.5-6.6s-3.6 6.6-6.5 6.6c-2.7 0-3.1-4.4-4.3-7.7C4 17.7 2.6 15 2.6 11.3c0-4.4 2.6-7.8 6.9-7.8Z"/></svg>
      <span><strong>ARK</strong> Dental Clinic</span>
    </a>
    <a class="call" id="callLink" href="tel:">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
      <span id="callText">Bizi arayın</span>
    </a>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Maskot">
      <div class="spotlight" aria-hidden="true"></div>

      <div class="bubble" id="bubble" data-state="text">
        <p class="bubble-text" id="bubbleText"></p>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <button class="bubble-speak" id="bubbleSpeak" type="button" title="Sesli dinle" aria-label="Mesajı sesli dinle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
        </button>
      </div>

      <div class="mascot" id="mascot" data-state="intro" role="img" aria-label="ARK Dental maskotu Kaptan Ark, el sallıyor">
        <div class="mascot-shadow" aria-hidden="true"></div>
        <div class="mascot-rig">
          <img class="layer" src="img/mascot-body.webp" alt="" draggable="false">
          <div class="layer jaw" aria-hidden="true"></div>
          <div class="eye eye-l" aria-hidden="true"><div class="lid"></div></div>
          <div class="eye eye-r" aria-hidden="true"><div class="lid"></div></div>
          <img class="layer glove" src="img/mascot-glove.webp" alt="" draggable="false">
        </div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </section>

    <section class="chat" aria-label="Sohbet">
      <header class="chat-head">
        <div class="avatar" aria-hidden="true"></div>
        <div class="who">
          <strong id="assistantName">Kaptan Ark</strong>
          <span class="status" id="status"><i></i>Çevrimiçi</span>
        </div>
        <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" title="Sesi kapat" aria-label="Sesli yanıtları kapat">
          <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
          <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.6 3 2.7 2.7-1.4 1.4-2.7-2.7-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4 2.7 2.7 2.7-2.7 1.4 1.4-2.7 2.7Z"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" type="button" title="Yeni sohbet" aria-label="Yeni sohbet başlat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
        </button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div class="chips" id="chips"></div>

      <form class="composer" id="composer" autocomplete="off">
        <button class="icon-btn mic" id="micBtn" type="button" title="Sesle yaz" aria-label="Sesle mesaj yaz" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></svg>
        </button>
        <label class="sr-only" for="input">Mesajınız</label>
        <textarea id="input" rows="1" maxlength="1000" placeholder="Sorunuzu yazın…" enterkeyhint="send"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Gönder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
        </button>
      </form>
      <p class="disclaimer">Kaptan Ark bir dijital asistandır, hata yapabilir ve muayenenin yerini tutmaz. Randevu talepleri WhatsApp ile kliniğe iletilir; ad ve telefonunuz yalnızca bu amaçla kullanılır.</p>
    </section>
  </main>

  <script src="js/app.js" type="module"></script>
</body>
</html>
