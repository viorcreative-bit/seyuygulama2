<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Randevu Paneli · ARK Dental</title>
  <link rel="icon" type="image/png" href="img/mascot-640.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: block; min-height: 100%; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
    h1 { font-size: 1.4rem; margin: 6px 0 16px; color: var(--navy); }
    .login { max-width: 380px; margin: 8vh auto 0; display: grid; gap: 12px; }
    .login input, .toolbar select, .toolbar input {
      font: inherit; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--card); color: var(--ink);
    }
    .btn { font: inherit; font-weight: 800; padding: 11px 16px; border-radius: 12px; border: 0; cursor: pointer; background: var(--teal-600); color: #fff; }
    .btn.ghost { background: transparent; color: var(--teal-700); border: 1.5px solid var(--teal-300); padding: 6px 12px; font-size: 0.85rem; }
    @media (prefers-color-scheme: dark) { .btn.ghost { color: var(--teal-300); } }
    .err { color: #c22; min-height: 1.2em; margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .toolbar .count { margin-left: auto; color: var(--muted); font-weight: 700; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    td.note { white-space: normal; min-width: 180px; color: var(--muted); }
    tr.cancelled td { opacity: 0.5; text-decoration: line-through; }
    tr.cancelled td:last-child { text-decoration: none; }
    tr.today td:first-child { box-shadow: inset 4px 0 0 var(--teal-500); }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 800; background: var(--teal-50); color: var(--teal-700); }
    @media (prefers-color-scheme: dark) { .tag { color: var(--teal-300); } }
    .empty { text-align: center; color: var(--muted); padding: 30px 0; }
    code { font-family: ui-monospace, Menlo, monospace; }
    td a { color: var(--teal-700); font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { td a { color: var(--teal-300); } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9.5 3.5c2.6 0 4.2 1.3 6.5 1.3s3.9-1.3 6.5-1.3c4.3 0 6.9 3.4 6.9 7.8 0 3.7-1.4 6.4-2.6 9.5-1.2 3.3-1.6 7.7-4.3 7.7-2.9 0-2.6-6.6-6.5-6.6s-3.6 6.6-6.5 6.6c-2.7 0-3.1-4.4-4.3-7.7C4 17.7 2.6 15 2.6 11.3c0-4.4 2.6-7.8 6.9-7.8Z"/></svg>
      <span><strong>ARK</strong> Randevu Paneli</span>
    </a>
    <button class="btn ghost" id="logout" type="button" hidden>Çıkış</button>
  </header>

  <div class="wrap">
    <form class="panel login" id="login">
      <h1>Yönetici girişi</h1>
      <label class="sr-only" for="pw">Şifre</label>
      <input id="pw" type="password" placeholder="Yönetici şifresi" autocomplete="current-password" required>
      <button class="btn" type="submit">Giriş yap</button>
      <p class="err" id="loginErr"></p>
    </form>

    <section class="panel" id="list" hidden>
      <h1>Randevular</h1>
      <div class="toolbar">
        <select id="filter" aria-label="Filtre">
          <option value="upcoming">Yaklaşan randevular</option>
          <option value="today">Bugün</option>
          <option value="all">Tümü</option>
          <option value="cancelled">İptal edilenler</option>
        </select>
        <input id="search" type="search" placeholder="İsim, telefon veya kod ara" aria-label="Ara">
        <button class="btn ghost" id="refresh" type="button">Yenile</button>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Tarih</th><th>Saat</th><th>Ad Soyad</th><th>Telefon</th><th>Hizmet</th><th>Kod</th><th>Not</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="admin.js" type="module"></script>
</body>
</html>
