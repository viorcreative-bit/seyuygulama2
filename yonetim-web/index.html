<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Aşçım Gelsin Yönetim</title>
  <style>
    :root {
      --kirmizi: #A30909;
      --sari: #FEC010;
      --krem: #FFF8E7;
      --metin: #2B1A12;
      --beyaz: #FFFFFF;
      --cizgi: #E5D9BF;
      --yesil: #1E6B3A;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--krem); color: var(--metin); }
    .gizli { display: none !important; }
    header { background: var(--kirmizi); color: var(--sari); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 12px; }
    header img { width: 44px; height: 44px; border-radius: 50%; }
    header .kisi { color: var(--krem); font-size: 14px; display: flex; align-items: center; gap: 12px; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
    .giris { max-width: 400px; margin: 10vh auto 0; background: var(--beyaz); border-radius: 20px; padding: 32px 24px; box-shadow: 0 6px 24px rgba(43,26,18,.12); text-align: center; }
    .giris img { width: 120px; height: 120px; }
    .giris h2 { color: var(--kirmizi); margin: 8px 0 20px; }
    label { display: block; text-align: left; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
    input, textarea, select { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--cizgi); border-radius: 12px; background: var(--beyaz); color: var(--metin); }
    textarea { min-height: 64px; resize: vertical; }
    .telSatir { display: flex; align-items: center; gap: 8px; }
    .telSatir span { font-weight: 700; font-size: 18px; }
    button { font: inherit; font-weight: 800; cursor: pointer; border-radius: 999px; padding: 11px 22px; border: 2px solid var(--kirmizi); background: var(--kirmizi); color: var(--sari); }
    button.cerceveli { background: transparent; color: var(--kirmizi); }
    button.tehlike { background: var(--beyaz); color: var(--kirmizi); border-color: var(--kirmizi); border-style: dashed; }
    button.kucuk { padding: 7px 16px; font-size: 14px; }
    button:disabled { opacity: .5; cursor: default; }
    .giris button { width: 100%; margin-top: 20px; }
    .hata { color: var(--kirmizi); font-weight: 600; margin-top: 14px; font-size: 14px; }
    .sekmeler { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .sekmeler .bosluk { flex: 1; }
    .sekme { background: transparent; color: var(--kirmizi); }
    .sekme.acik { background: var(--kirmizi); color: var(--sari); }
    .filtre { width: auto; padding: 9px 12px; }
    .arama { flex: 1; min-width: 160px; }
    .kartlar { display: grid; gap: 14px; }
    .kart { background: var(--beyaz); border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 10px rgba(43,26,18,.08); }
    .kart .ust { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .kart h3 { margin: 0; font-size: 18px; }
    .kart p { margin: 6px 0 0; line-height: 1.5; font-size: 15px; }
    .soluk { opacity: .65; font-size: 14px; }
    .rozet { display: inline-block; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--cizgi); font-size: 13px; font-weight: 700; background: var(--beyaz); }
    .rozet.bekliyor { background: var(--sari); border-color: var(--sari); }
    .rozet.onayli { background: var(--yesil); border-color: var(--yesil); color: var(--beyaz); }
    .rozet.red { background: var(--metin); border-color: var(--metin); color: var(--krem); }
    .rozet.inceleniyor { background: var(--kirmizi); border-color: var(--kirmizi); color: var(--sari); }
    .kimlik { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; background: var(--kirmizi); cursor: zoom-in; }
    .avatar.harf { display: flex; align-items: center; justify-content: center; color: var(--sari); font-weight: 800; font-size: 22px; cursor: default; }
    .galeri { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .galeri img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; cursor: zoom-in; border: 1px solid var(--cizgi); }
    .perde { position: fixed; inset: 0; background: rgba(43,26,18,.85); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; cursor: zoom-out; }
    .perde img { max-width: 100%; max-height: 100%; border-radius: 16px; background: var(--beyaz); }
    .eylemler { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .bos { text-align: center; padding: 48px 0; opacity: .7; }
    .ozet { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .ozet div { background: var(--beyaz); border-radius: 14px; padding: 12px 18px; font-size: 14px; }
    .ozet b { display: block; font-size: 24px; color: var(--kirmizi); }
  </style>
</head>
<body>
  <header class="gizli" id="ust">
    <h1><img src="logo.png" alt="" />Aşçım Gelsin Yönetim</h1>
    <div class="kisi"><span id="kisi"></span><button class="cerceveli kucuk" id="cikis" style="color:var(--krem);border-color:var(--krem)">Çıkış</button></div>
  </header>

  <main>
    <section class="giris" id="giris">
      <img src="logo.png" alt="Aşçım Gelsin" />
      <h2>Yönetici Girişi</h2>
      <form id="form" autocomplete="on">
        <label for="tel">Telefon numarası</label>
        <div class="telSatir"><span>+90</span><input id="tel" type="tel" inputmode="numeric" placeholder="5XX XXX XX XX" autocomplete="username" /></div>
        <label for="sifre">Şifre</label>
        <input id="sifre" type="password" autocomplete="current-password" />
        <div class="hata gizli" id="hata"></div>
        <button type="submit" id="girisDugme">Giriş Yap</button>
      </form>
    </section>

    <section class="gizli" id="panel">
      <div class="ozet" id="ozet"></div>
      <div class="sekmeler">
        <button class="sekme acik" id="sekmeAscilar">Aşçılar</button>
        <button class="sekme" id="sekmeUyeler">Üyeler</button>
        <button class="sekme" id="sekmeSikayetler">Şikayetler</button>
        <span class="bosluk"></span>
        <button class="cerceveli kucuk" id="yenile">Yenile</button>
      </div>
      <div class="sekmeler" id="filtreAlani"></div>
      <div class="kartlar" id="liste"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="yonetim.js"></script>
</body>
</html>
