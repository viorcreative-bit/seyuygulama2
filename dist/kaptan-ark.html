  <style>
:root {
  --teal-700: #0b6f73;
  --teal-600: #0f8c8f;
  --teal-500: #17a6a6;
  --teal-300: #7fd6d2;
  --teal-50: #e8f7f6;
  --navy: #12304a;
  --ink: #1b2a35;
  --muted: #5b6d78;
  --bg: #f1f9f8;
  --bg-2: #dff3f1;
  --card: #ffffff;
  --line: #d9ebea;
  --user: #0f8c8f;
  --user-ink: #ffffff;
  --shadow: 0 18px 50px -20px rgba(11, 70, 80, 0.35);
  --radius: 22px;
  --spot: radial-gradient(closest-side, #ffffff 0%, #ffffff 55%, rgba(255, 255, 255, 0) 100%);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --navy: #cfe9ec;
    --ink: #e4f1f1;
    --muted: #97adb3;
    --bg: #0a171d;
    --bg-2: #0e2730;
    --card: #10232b;
    --line: #1d3a43;
    --teal-50: #133640;
    --shadow: 0 18px 50px -20px rgba(0, 0, 0, 0.6);
    --spot: radial-gradient(closest-side, rgba(214, 244, 241, 0.95) 0%, rgba(160, 222, 218, 0.55) 55%, rgba(160, 222, 218, 0) 100%);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 700px at 15% 10%, var(--bg-2), transparent 60%),
    radial-gradient(900px 600px at 100% 100%, var(--bg-2), transparent 60%),
    var(--bg);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

button { font: inherit; color: inherit; }

/* ---------- Üst bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px clamp(16px, 4vw, 40px);
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--navy); text-decoration: none; font-size: 1.15rem; letter-spacing: 0.02em;
}
.brand svg { width: 30px; height: 30px; fill: var(--teal-500); }
.brand strong { font-weight: 900; letter-spacing: 0.08em; }
.call {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 999px;
  background: var(--card); color: var(--teal-700); text-decoration: none; font-weight: 800;
  border: 1px solid var(--line); box-shadow: 0 6px 18px -12px rgba(11, 70, 80, 0.5);
}
@media (prefers-color-scheme: dark) { .call { color: var(--teal-300); } }
.call svg { width: 18px; height: 18px; fill: currentColor; }

/* ---------- Yerleşim ---------- */
.layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 460px);
  gap: clamp(16px, 3vw, 40px);
  padding: 0 clamp(16px, 4vw, 40px) clamp(16px, 3vw, 32px);
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
}

/* ---------- Sahne ve maskot ---------- */
.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 0;
}
.spotlight {
  position: absolute;
  width: min(95%, 640px);
  aspect-ratio: 1;
  top: 50%;
  left: 50%;
  translate: -50% -42%;
  background: var(--spot);
  pointer-events: none;
}

.bubble {
  position: relative;
  z-index: 2;
  max-width: min(440px, 92%);
  min-height: 56px;
  padding: 16px 48px 16px 20px;
  background: var(--card);
  color: var(--ink);
  border-radius: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  font-size: 1.05rem;
  line-height: 1.5;
  font-weight: 600;
  transform-origin: 30% 100%;
  animation: bubble-in 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both 0.35s;
}
.bubble::after {
  content: "";
  position: absolute;
  left: 34%;
  bottom: -12px;
  width: 24px;
  height: 24px;
  background: var(--card);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transform: rotate(45deg);
  border-bottom-right-radius: 6px;
}
.bubble-text { margin: 0; white-space: pre-line; max-height: 9.5em; overflow-y: auto; }
.bubble .dots { display: none; }
.bubble[data-state="thinking"] .bubble-text { display: none; }
.bubble[data-state="thinking"] .dots { display: inline-flex; }
.bubble-speak {
  position: absolute; right: 10px; top: 10px;
  width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: var(--teal-50); cursor: pointer; display: grid; place-items: center;
}
.bubble-speak svg { width: 18px; height: 18px; fill: var(--teal-600); }
@media (prefers-color-scheme: dark) { .bubble-speak svg { fill: var(--teal-300); } }

.dots { gap: 6px; padding: 8px 2px; }
.dots i {
  width: 9px; height: 9px; border-radius: 50%; background: var(--teal-500);
  animation: dot 1.1s ease-in-out infinite;
}
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }

.mascot {
  position: relative;
  z-index: 1;
  width: min(100%, 540px, calc((100dvh - 250px) * 1.122));
  min-width: 180px;
  aspect-ratio: 1278 / 1139;
  container-type: inline-size;
  cursor: pointer;
  animation: pop-in 0.9s cubic-bezier(0.2, 1.3, 0.4, 1) both;
  -webkit-tap-highlight-color: transparent;
}
.mascot-rig {
  position: absolute;
  inset: 0;
  transform-origin: 50% 97%;
  animation: bob 3.4s ease-in-out infinite;
}
.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

/* Göz kapakları */
.eye {
  position: absolute;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
}
.eye-l { left: 35.76%; top: 16.94%; width: 10.49%; height: 12.12%; }
.eye-r { left: 55.63%; top: 14.93%; width: 9.08%; height: 12.47%; }
.lid {
  position: absolute;
  left: -12%;
  right: -12%;
  top: -10%;
  height: 118%;
  background: linear-gradient(180deg, #f4f0ec 0%, #ece7e2 70%, #e2dcd6 100%);
  border-bottom: max(1.5px, 0.42cqw) solid #1d2a33;
  border-radius: 0 0 50% 50% / 0 0 38% 38%;
  transform: translateY(-101%);
}
.eye.blink .lid { animation: blink 180ms ease-in-out; }

/* El sallama */
.glove { transform-origin: 79.4% 42.1%; }
.mascot[data-state="intro"] .glove,
.mascot.wave .glove { animation: wave 1.9s ease-in-out; }
.mascot[data-state="talking"]:not(.wave) .glove { animation: gesture 1.3s ease-in-out infinite alternate; }

.mascot[data-state="talking"] .mascot-rig { animation: bob-talk 1.4s ease-in-out infinite; }
.mascot[data-state="thinking"] .mascot-rig { animation: think 2.6s ease-in-out infinite; }
.mascot[data-state="listening"] .mascot-rig { animation: listen 2s ease-in-out infinite; }
.mascot.happy .mascot-rig { animation: jump 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) 2; }

.mascot-shadow {
  position: absolute;
  left: 19%;
  right: 26%;
  bottom: -2.5%;
  height: 7%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(10, 60, 70, 0.32), rgba(10, 60, 70, 0));
  animation: shadow 3.4s ease-in-out infinite;
}
.mascot[data-state="talking"] .mascot-shadow { animation-duration: 1.4s; }

.sparkles { position: absolute; inset: 0; pointer-events: none; }
.sparkles i {
  position: absolute;
  width: 4cqw; height: 4cqw;
  background: conic-gradient(from 45deg, #ffd56b, #fff3c4, #ffd56b, #fff3c4, #ffd56b);
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: sparkle 1.2s ease-out forwards;
}

/* ---------- Sohbet ---------- */
.chat {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-height: calc(100dvh - 90px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.chat-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px 14px 16px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, var(--teal-600), var(--teal-500));
  color: #fff;
}
.avatar {

.who { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.who strong { font-size: 1.05rem; font-weight: 800; }
.status { font-size: 0.82rem; opacity: 0.92; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status i { flex: none; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: #7dffb4; box-shadow: 0 0 0 3px rgba(125, 255, 180, 0.25); }
.status.offline i { background: #ffc66b; box-shadow: 0 0 0 3px rgba(255, 198, 107, 0.25); }

.icon-btn {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 12px;
  background: transparent; cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
.chat-head .icon-btn { color: #fff; background: rgba(255, 255, 255, 0.14); }
.chat-head .icon-btn:hover { background: rgba(255, 255, 255, 0.26); }
#soundBtn .off, #soundBtn[aria-pressed="false"] .on { display: none; }
#soundBtn[aria-pressed="false"] .off { display: block; }

.messages {
  flex: 1;
  min-height: 160px;
  overflow-y: auto;
  padding: 18px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.msg {
  max-width: 86%;
  padding: 11px 15px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 0.98rem;
  white-space: pre-line;
  overflow-wrap: anywhere;
  animation: msg-in 0.28s ease-out both;
}
.msg.bot { align-self: flex-start; background: var(--teal-50); border-bottom-left-radius: 6px; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 6px; }
.msg.error { align-self: center; background: transparent; color: #b4232a; font-size: 0.9rem; text-align: center; }
@media (prefers-color-scheme: dark) { .msg.error { color: #ff8a8f; } }
.msg.typing { padding: 6px 14px; }
.msg.typing .dots { display: inline-flex; }

.appt {
  align-self: stretch;
  border: 1px solid var(--teal-300);
  background: linear-gradient(135deg, var(--teal-50), var(--card));
  border-radius: 18px;
  padding: 14px 16px;
  animation: msg-in 0.35s ease-out both;
}
.appt h4 { margin: 0 0 8px; font-size: 1rem; color: var(--teal-700); display: flex; align-items: center; gap: 8px; }
@media (prefers-color-scheme: dark) { .appt h4 { color: var(--teal-300); } }
.appt dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.95rem; }
.appt dt { color: var(--muted); }
.appt dd { margin: 0; font-weight: 700; }
.appt .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; }
.appt button {
  margin-top: 12px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--teal-500); background: transparent; color: var(--teal-700); font-weight: 800;
}
@media (prefers-color-scheme: dark) { .appt button { color: var(--teal-300); } }
.appt-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.appt-note { margin: 0; font-size: 0.9rem; color: var(--muted); flex-basis: 100%; }
.appt .wa {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 999px;
  background: #1fa855; color: #fff; font-weight: 800; text-decoration: none;
  box-shadow: 0 8px 20px -10px rgba(31, 168, 85, 0.8);
  transition: transform 0.15s, background 0.15s;
}
.appt .wa:hover { background: #178f47; transform: translateY(-1px); }
.appt .wa svg { width: 20px; height: 20px; fill: currentColor; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 10px; max-height: 148px; overflow-y: auto; }
.chips:empty { display: none; }
.chips button, .chips a {
  text-decoration: none;
  flex: none;
  border: 1px solid var(--teal-300);
  background: var(--card);
  color: var(--teal-700);
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}
@media (prefers-color-scheme: dark) { .chips button, .chips a { color: var(--teal-300); } }
.chips button:hover, .chips a:hover { background: var(--teal-50); transform: translateY(-1px); }

.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin: 0 12px;
  padding: 8px;
  border: 1.5px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.composer:focus-within { border-color: var(--teal-500); box-shadow: 0 0 0 4px rgba(23, 166, 166, 0.15); }
.composer textarea {
  flex: 1;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 1rem;
  line-height: 1.4;
  padding: 9px 4px;
  max-height: 140px;
}
.composer textarea::placeholder { color: var(--muted); }
.composer .mic { color: var(--teal-600); }
.composer .mic:hover { background: var(--teal-50); }
.composer .mic.listening { color: #fff; background: #e5484d; animation: pulse 1.2s ease-in-out infinite; }
.send {
  width: 42px; height: 42px; flex: none;
  border: 0; border-radius: 14px; cursor: pointer;
  background: var(--teal-600); color: #fff;
  display: grid; place-items: center;
  transition: background 0.15s, transform 0.1s;
}
.send:hover { background: var(--teal-700); }
.send:active { transform: scale(0.94); }
.send:disabled { opacity: 0.5; cursor: default; }
.send svg { width: 20px; height: 20px; fill: currentColor; }

.disclaimer { margin: 8px 16px 12px; font-size: 0.74rem; color: var(--muted); line-height: 1.4; text-align: center; }

:focus-visible { outline: 3px solid var(--teal-500); outline-offset: 2px; }

/* ---------- Mobil ---------- */
@media (max-width: 860px) {
  .topbar { padding: 10px 16px; }
  .call span { display: none; }
  .call { padding: 9px; }
  .layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 0 16px 16px; }
  .stage { flex-direction: row; align-items: flex-end; justify-content: center; gap: 4px; }
  .stage .mascot { width: min(42vw, 280px, calc(26dvh * 1.122)); min-width: 120px; order: 1; }
  .stage .bubble { order: 2; font-size: 0.92rem; padding: 12px 40px 12px 14px; align-self: center; margin-bottom: 18%; }
  .stage .bubble::after { left: -8px; bottom: 22px; transform: rotate(135deg); }
  .spotlight { width: min(70vw, 340px); translate: -82% -46%; }
  .bubble-text { max-height: 6.2em; }
  .chat { max-height: none; }
  .messages { min-height: 90px; padding-top: 14px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; }
  .disclaimer { margin: 6px 14px 10px; font-size: 0.7rem; }
}
@media (max-width: 460px) {
  .stage .bubble { display: none; }
  .spotlight { translate: -50% -46%; }
  .layout { padding: 0 10px 10px; }
  .chat-head { padding: 10px 10px 10px 12px; }
  .avatar { width: 38px; height: 38px; }
  .composer { margin: 0 8px; }
}

/* Gömülü (widget) görünüm */
body.embed .topbar { display: none; }
body.embed .layout { padding: 0; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 0; }
body.embed .stage { flex-direction: row; padding: 6px 12px 0; }
body.embed .stage .bubble { display: none; }
body.embed .stage .mascot { width: 150px; min-width: 0; }
body.embed .spotlight { width: 220px; translate: -50% -44%; }
body.embed .chat { border-radius: 0; border: 0; box-shadow: none; max-height: none; }

/* Ses deneme paneli (?sesler) */
.voice-panel {
  position: fixed; left: 16px; bottom: 16px; z-index: 50;
  width: min(440px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto;
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 16px;
}
.voice-panel h3 { margin: 0 0 6px; font-size: 1.05rem; }
.voice-panel p { margin: 0 0 12px; font-size: 0.85rem; color: var(--muted); }
.voice-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
.voice-panel button { border: 1px solid var(--teal-300); background: var(--card); color: var(--teal-700); border-radius: 999px; padding: 6px 12px; font-weight: 800; cursor: pointer; flex: none; }
.voice-close { margin-top: 10px; }

/* ---------- Animasyonlar ---------- */
@keyframes pop-in {
  from { opacity: 0; transform: translateY(8%) scale(0.86); }
  to { opacity: 1; transform: none; }
}
@keyframes bubble-in {
  from { opacity: 0; transform: scale(0.6); }
  to { opacity: 1; transform: none; }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-0.8deg) scale(1, 1); }
  50% { transform: translateY(-1.8%) rotate(0.8deg) scale(0.996, 1.012); }
}
@keyframes bob-talk {
  0%, 100% { transform: translateY(0) rotate(-1.2deg); }
  25% { transform: translateY(-1.2%) rotate(0.4deg); }
  50% { transform: translateY(-0.4%) rotate(1.4deg); }
  75% { transform: translateY(-1.4%) rotate(0deg); }
}
@keyframes think {
  0%, 100% { transform: rotate(-3.2deg) translateY(-0.6%); }
  50% { transform: rotate(-1.6deg) translateY(-1.6%); }
}
@keyframes listen {
  0%, 100% { transform: rotate(2.4deg); }
  50% { transform: rotate(3.4deg) translateY(-1%); }
}
@keyframes jump {
  0% { transform: translateY(0) scale(1.04, 0.94); }
  35% { transform: translateY(-9%) scale(0.97, 1.04) rotate(-2deg); }
  70% { transform: translateY(0) scale(1.05, 0.95); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes shadow {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.92); opacity: 0.8; }
}
@keyframes wave {
  0% { rotate: 0deg; }
  14% { rotate: -18deg; }
  28% { rotate: 7deg; }
  42% { rotate: -18deg; }
  56% { rotate: 7deg; }
  72% { rotate: -12deg; }
  100% { rotate: 0deg; }
}
@keyframes gesture {
  from { rotate: 1deg; }
  to { rotate: -7deg; }
}
@keyframes blink {
  0% { transform: translateY(-101%); }
  45%, 55% { transform: translateY(-1%); }
  100% { transform: translateY(-101%); }
}
@keyframes dot {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
  40% { transform: translateY(-5px); opacity: 1; }
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0.45); }
  50% { box-shadow: 0 0 0 8px rgba(229, 72, 77, 0); }
}
@keyframes sparkle {
  0% { opacity: 0; transform: translate(0, 0) scale(0.2) rotate(0deg); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(160deg); }
}

@media (prefers-reduced-motion: reduce) {
  .mascot, .bubble, .msg, .appt { animation: none !important; }
  .mascot-rig, .mascot-shadow { animation: none !important; }
  .mascot .glove { animation: none !important; }
  .jaw { transition: none; }
}

</style>

  <script type="module">
const __time = (() => {
// Takvim yardımcıları. Tarihler "YYYY-MM-DD", saatler "HH:MM" metni olarak tutulur;
// "şu an" her zaman kliniğin saat diliminde hesaplanır (sunucunun saat dilimi önemsizdir).

const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const WEEKDAYS_TR = {
  monday: 'Pazartesi',
  tuesday: 'Salı',
  wednesday: 'Çarşamba',
  thursday: 'Perşembe',
  friday: 'Cuma',
  saturday: 'Cumartesi',
  sunday: 'Pazar',
};

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

function isValidDate(dateStr) {
  if (typeof dateStr !== 'string' || !DATE_RE.test(dateStr)) return false;
  const d = new Date(`${dateStr}T00:00:00Z`);
  return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === dateStr;
}

function isValidTime(timeStr) {
  return typeof timeStr === 'string' && TIME_RE.test(timeStr);
}

function toMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function fromMinutes(total) {
  const h = String(Math.floor(total / 60)).padStart(2, '0');
  const m = String(total % 60).padStart(2, '0');
  return `${h}:${m}`;
}

function weekdayOf(dateStr) {
  return WEEKDAYS[new Date(`${dateStr}T00:00:00Z`).getUTCDay()];
}

function addDays(dateStr, days) {
  const d = new Date(`${dateStr}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function daysBetween(fromDate, toDate) {
  return Math.round((Date.parse(`${toDate}T00:00:00Z`) - Date.parse(`${fromDate}T00:00:00Z`)) / 86_400_000);
}

/** Verilen saat dilimindeki tarih ve saati döndürür. */
function nowIn(timeZone, at = new Date()) {
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat('en-CA', {
      timeZone,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hourCycle: 'h23',
    })
      .formatToParts(at)
      .map((p) => [p.type, p.value]),
  );
  const date = `${parts.year}-${parts.month}-${parts.day}`;
  const time = `${parts.hour}:${parts.minute}`;
  return { date, time, minutes: toMinutes(time), weekday: weekdayOf(date) };
}

/** "2026-11-20" -> "20 Kasım 2026 Cuma" */
function formatDateTr(dateStr) {
  const d = new Date(`${dateStr}T12:00:00Z`);
  const text = new Intl.DateTimeFormat('tr-TR', {
    timeZone: 'UTC',
    day: 'numeric',
    month: 'long',
    year: 'numeric',
  }).format(d);
  return `${text} ${WEEKDAYS_TR[weekdayOf(dateStr)]}`;
}

return { WEEKDAYS, WEEKDAYS_TR, isValidDate, isValidTime, toMinutes, fromMinutes, weekdayOf, addDays, daysBetween, nowIn, formatDateTr };
})();

const __booking = (() => {
// Randevu talebi yardımcıları: boş gün/saat listesi ve WhatsApp mesajı.
// Sunucu olmadığı için dolu saatler bilinemez; çalışma saatlerine göre seçenek sunulur,
// kesin onayı klinik WhatsApp üzerinden verir.
const { addDays, daysBetween, formatDateTr, fromMinutes, isValidDate, nowIn, toMinutes, weekdayOf, WEEKDAYS_TR } = __time;

function daySlots(clinic, date) {
  const hours = clinic.workingHours?.[weekdayOf(date)];
  if (!hours) return [];
  const step = clinic.appointment?.slotMinutes ?? 30;
  const [open, close] = hours.map(toMinutes);
  const breaks = (clinic.breaks ?? []).map(([s, e]) => [toMinutes(s), toMinutes(e)]);
  const slots = [];
  for (let t = open; t + step <= close; t += step) {
    if (!breaks.some(([s, e]) => t < e && t + step > s)) slots.push(fromMinutes(t));
  }
  return slots;
}

function dateProblem(clinic, date, now) {
  if (!isValidDate(date)) return 'Geçersiz tarih.';
  const ahead = daysBetween(now.date, date);
  if (ahead < 0) return 'Bu tarih geçmişte kaldı.';
  if (ahead > (clinic.appointment?.maxDaysAhead ?? 30)) return 'Bu tarih randevu takviminin dışında.';
  if ((clinic.closedDates ?? []).includes(date)) return 'Klinik bu tarihte kapalı.';
  if (!clinic.workingHours?.[weekdayOf(date)]) return `Klinik ${WEEKDAYS_TR[weekdayOf(date)]} günleri kapalı.`;
  return null;
}

/** Bir gün için seçilebilecek saatler (bugünse yakın saatler hariç). */
function availableSlots(clinic, date, now) {
  if (dateProblem(clinic, date, now)) return [];
  const earliest = date === now.date ? now.minutes + (clinic.appointment?.minNoticeMinutes ?? 60) : -1;
  return daySlots(clinic, date).filter((t) => toMinutes(t) >= earliest);
}

function shortLabel(date, now) {
  const d = new Date(`${date}T12:00:00Z`);
  const text = new Intl.DateTimeFormat('tr-TR', { timeZone: 'UTC', day: 'numeric', month: 'short', weekday: 'short' }).format(d);
  const ahead = daysBetween(now.date, date);
  if (ahead === 0) return `Bugün · ${text}`;
  if (ahead === 1) return `Yarın · ${text}`;
  return text;
}

/** Randevu verilebilen ilk `count` gün. */
function openDays(clinic, now, count = 8) {
  const days = [];
  const max = clinic.appointment?.maxDaysAhead ?? 30;
  for (let i = 0; i <= max && days.length < count; i++) {
    const date = addDays(now.date, i);
    if (availableSlots(clinic, date, now).length) days.push({ date, label: shortLabel(date, now), long: formatDateTr(date) });
  }
  return days;
}

function clinicNow(clinic, at = new Date()) {
  return nowIn(clinic.timezone ?? 'Europe/Istanbul', at);
}

/** Telefonu okunaklı hale getirir; geçersizse null. */
function normalizePhone(input) {
  if (typeof input !== 'string') return null;
  const trimmed = input.trim();
  const plus = trimmed.startsWith('+') || trimmed.startsWith('00');
  let digits = trimmed.replace(/\D/g, '');
  if (trimmed.startsWith('00')) digits = digits.slice(2);
  if (!plus) {
    if (digits.length === 11 && digits.startsWith('0')) digits = `90${digits.slice(1)}`;
    else if (digits.length === 10 && /^[2-5]/.test(digits)) digits = `90${digits}`;
  }
  if (digits.startsWith('90') && digits.length !== 12) return null;
  if (digits.length < 8 || digits.length > 15) return null;
  if (digits.startsWith('90')) {
    const n = digits.slice(2);
    return `0${n.slice(0, 3)} ${n.slice(3, 6)} ${n.slice(6, 8)} ${n.slice(8)}`;
  }
  return `+${digits}`;
}

function validName(input) {
  const name = String(input ?? '').trim().replace(/\s+/g, ' ');
  return name.length >= 3 && name.length <= 80 && /\p{L}/u.test(name) ? name : null;
}

function whatsappNumber(clinic) {
  const digits = String(clinic.whatsapp ?? '').replace(/\D/g, '');
  return digits.length >= 10 && digits.length <= 15 ? digits : null;
}

function bookingMessage(clinic, req) {
  const lines = [
    `Merhaba, ${clinic.shortName ?? clinic.name} web sitesinden randevu talebi:`,
    `• Hizmet: ${req.service}`,
    `• Tarih: ${formatDateTr(req.date)}`,
    `• Saat: ${req.time}`,
    `• Ad Soyad: ${req.name}`,
    `• Telefon: ${req.phone}`,
  ];
  if (req.note) lines.push(`• Not: ${req.note}`);
  lines.push('Uygunluk durumunu bildirmenizi rica ederim.');
  return lines.join('\n');
}

function whatsappLink(clinic, req) {
  const number = whatsappNumber(clinic);
  if (!number) return null;
  return `https://wa.me/${number}?text=${encodeURIComponent(bookingMessage(clinic, req))}`;
}

return { daySlots, dateProblem, availableSlots, openDays, clinicNow, normalizePhone, validName, whatsappNumber, bookingMessage, whatsappLink };
})();

const __faq = (() => {
// Yapay zeka olmadan çalışan hazır cevap motoru. Soruyu anahtar kelimelerle eşleştirir ve
// cevabı clinic.json'daki bilgilerden üretir. Yapay zeka açıkken de acil durum ve randevu
// gibi kesin davranması gereken konular burada karşılanır.
const { WEEKDAYS_TR } = __time;

/** Türkçe karakterleri sadeleştirir: "İmplantı NE KADAR?" -> "implanti ne kadar" */
function normalize(text) {
  return String(text ?? '')
    .toLocaleLowerCase('tr')
    .replace(/ı/g, 'i')
    .replace(/ç/g, 'c')
    .replace(/ğ/g, 'g')
    .replace(/ö/g, 'o')
    .replace(/ş/g, 's')
    .replace(/ü/g, 'u')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/** Kelime başı eşleşmesi: "implant" anahtarı "implantim", "implanti" ile de eşleşir. */
function has(n, keywords) {
  return keywords.some((k) => {
    const key = normalize(k);
    if (!key) return false;
    // Kısa anahtarlar ("hi", "tsk") yalnızca tam kelime olarak eşleşir.
    if (key.length <= 3) return ` ${n} `.includes(` ${key} `);
    return ` ${n}`.includes(` ${key}`);
  });
}

function count(n, keywords) {
  return keywords.reduce((c, k) => c + (has(n, [k]) ? 1 : 0), 0);
}

const KW = {
  emergency: [
    'acil', 'siddetli agri', 'cok agri', 'dayanilmaz', 'sislik', 'sisti', 'sismis', 'sisme', 'yuzum sis',
    'kanama durmuyor', 'kanamam durmuyor', 'durmayan kanama', 'travma', 'kaza', 'disim kirildi', 'dis kirildi',

  ],

  language: ['ingilizce', 'english', 'yabanci dil', 'almanca', 'arapca', 'rusca', 'hangi dil'],
  services: ['hizmet', 'tedavi', 'neler yap', 'ne yapiyorsunuz', 'bolum', 'services', 'treatment'],
  pain: ['agri', 'agriyor', 'sizliyor', 'sizi', 'hassasiyet', 'hassas', 'zonkl', 'pain', 'hurt'],
  greeting: ['merhaba', 'selam', 'iyi gunler', 'gunaydin', 'iyi aksamlar', 'hello', 'hi', 'hey', 'mrb', 'slm', 'naber'],

// Genel bilgilendirme metinleri (klinik iddiası içermez).
const GENERAL_INFO = {
  implant:
    'İmplant, eksik dişin yerine çene kemiğine yerleştirilen titanyum bir vida ve üzerine yapılan kalıcı dişten oluşur. Süreç genellikle muayene ve röntgen, implantın yerleştirilmesi, kemikle kaynaşması için birkaç aylık bekleme ve son olarak üst yapının takılması şeklinde ilerler. İşlem lokal anestezi ile yapıldığı için ağrı hissedilmez.',

    'Zirkonyum kaplama, metal içermeyen, ışığı doğal dişe benzer şekilde geçiren dayanıklı bir kaplamadır. Genellikle ölçü, prova ve yapıştırma olmak üzere birkaç seansta tamamlanır.',

    'Ortodontik tedavide çapraşık dişler diş teli (braket) ya da şeffaf plaklarla düzeltilir. Süre kişiye göre değişir ve genellikle aylar sürer; muayenede size uygun yöntem belirlenir.',
  temizlik:
    'Diş taşı temizliğinde diş yüzeyindeki taşlar ve lekeler özel aletlerle temizlenir, ardından cila yapılır. Yılda en az bir kez önerilir ve diş eti sağlığı için önemlidir.',
  cocuk:
    'Çocuk diş hekimliğinde süt ve daimi dişlerin takibi, flor uygulaması, fissür örtücü ve çocuklara uygun tedaviler yapılır. İlk kontrolün ilk diş çıktıktan sonra yapılması önerilir.',

    'Diş eti kanaması ve çekilmesi çoğunlukla diş taşı ve iltihaba bağlıdır. Profesyonel temizlik ve gerekirse diş eti tedavisi ile kontrol altına alınır.',

function serviceInfo(service) {
  const n = normalize(`${service.name} ${(service.keywords ?? []).join(' ')}`);
  for (const [key, text] of Object.entries(GENERAL_INFO)) if (n.includes(normalize(key))) return text;
  return null;
}

/** Mesajda en çok geçen hizmeti bulur. */
function detectService(clinic, text) {
  const n = normalize(text);
  let best = null;
  let bestScore = 0;
  for (const s of clinic.services ?? []) {
    const score = count(n, [s.name, ...(s.keywords ?? [])]);
    if (score > bestScore) {
      best = s;
      bestScore = score;
    }
  }
  return best;
}

function hoursText(clinic) {
  const groups = [];
  for (const [day, h] of Object.entries(clinic.workingHours ?? {})) {
    const value = h ? `${h[0]}–${h[1]}` : 'kapalı';
    const last = groups.at(-1);
    if (last && last.value === value) last.days.push(day);
    else groups.push({ value, days: [day] });
  }
  const lines = groups.map((g) => {
    const names = g.days.map((d) => WEEKDAYS_TR[d]);
    const label = names.length > 2 ? `${names[0]}–${names.at(-1)}` : names.join(', ');
    return `• ${label}: ${g.value}`;
  });
  const breaks = (clinic.breaks ?? []).map(([s, e]) => `${s}–${e}`).join(', ');
  return `Çalışma saatlerimiz:\n${lines.join('\n')}${breaks ? `\nÖğle arası: ${breaks}` : ''}`;
}

function faqMatch(clinic, n) {
  const stop = new Set(['mi', 'mu', 'misiniz', 'musunuz', 'var', 'yok', 've', 'ile', 'bir', 'bu', 'ne', 'nasil', 'icin', 'da', 'de', 'ki']);
  let best = null;
  let bestScore = 0;
  for (const item of clinic.faq ?? []) {
    const words = normalize(item.q)
      .split(' ')
      .filter((w) => w.length >= 3 && !stop.has(w));
    if (!words.length) continue;
    const hits = words.filter((w) => ` ${n}`.includes(` ${w.slice(0, Math.max(4, w.length - 2))}`)).length;
    const score = hits / words.length;
    const strong = score >= 0.6 || (hits >= 2 && score >= 0.4);
    if (strong && score > bestScore) {
      best = item;
      bestScore = score;
    }
  }
  return best;
}

const CHIP_BOOK = { label: '📅 Randevu al', action: 'booking' };

function contactChips(clinic) {
  const chips = [];
  if (clinic.phone) chips.push({ label: '📞 Bizi arayın', href: `tel:${clinic.phone.replace(/[^\d+]/g, '')}` });
  const wa = String(clinic.whatsapp ?? '').replace(/\D/g, '');
  if (wa.length >= 10) chips.push({ label: '💬 WhatsApp', href: `https://wa.me/${wa}` });
  return chips;
}

/** Kesin davranılması gereken konular (yapay zeka açık olsa bile önce bunlara bakılır). */
function priorityAnswer(clinic, text) {
  const n = normalize(text);
  if (has(n, KW.emergency)) {
    return {
      intent: 'emergency',
      text: `Geçmiş olsun! Yüzünüzde veya boynunuzda hızla büyüyen şişlik, ateşle birlikte şişlik, nefes alma ya da yutkunma güçlüğü, durmayan kanama veya ciddi bir darbe varsa lütfen hemen 112'yi arayın.\nŞiddetli diş ağrısı için bizi hemen arayabilirsiniz: ${clinic.phone}. İsterseniz en yakın randevu için de yardımcı olayım.`,
      chips: [{ label: '🚑 112', href: 'tel:112' }, ...contactChips(clinic), CHIP_BOOK],
    };
  }
  if (has(n, KW.cancel) && (has(n, KW.booking) || n.split(' ').length <= 3)) {
    return {
      intent: 'cancel',
      text: 'Randevunuzu iptal etmek ya da değiştirmek için bize WhatsApp\'tan yazabilir veya telefonla ulaşabilirsiniz. Yeni bir randevu talebi de oluşturabilirim.',
      chips: [...contactChips(clinic), CHIP_BOOK],
    };
  }
  if (has(n, KW.booking)) {
    const service = detectService(clinic, text);
    return { intent: 'booking', action: 'booking', service: service?.name ?? null };
  }
  return null;
}

/** Hazır cevap üretir. Her zaman bir cevap döner. */
function answer(clinic, text) {
  const priority = priorityAnswer(clinic, text);
  if (priority) return priority;

  const n = normalize(text);
  const words = n.split(' ').filter(Boolean);
  const faq = faqMatch(clinic, n);
  if (faq) return { intent: 'faq', text: faq.a, chips: [CHIP_BOOK] };

  const service = detectService(clinic, text);

  const asksDuration = has(n, ['surer', 'suruyor', 'surmek', 'sure', 'zaman', 'kac gun', 'kac seans', 'how long']);
  if (has(n, KW.price) || (has(n, ['ne kadar']) && !asksDuration)) {
    const prices = Object.entries(clinic.prices?.items ?? {});
    const exact = service && prices.find(([k]) => normalize(k) === normalize(service.name));
    if (exact) return { intent: 'price', text: `${exact[0]}: ${exact[1]}. Kesin tutar muayeneden sonra netleşir.`, chips: [CHIP_BOOK] };
    if (prices.length && !service) {
      return {
        intent: 'price',
        text: `Paylaşabildiğimiz fiyatlar:\n${prices.map(([k, v]) => `• ${k}: ${v}`).join('\n')}\nDiğer tedavilerin ücreti muayeneden sonra belirlenir.`,
        chips: [CHIP_BOOK],
      };
    }
    return {
      intent: 'price',
      text: `${service ? `${service.name} ücreti` : 'Tedavi ücretleri'}, muayenede ağız yapınıza göre hazırlanan tedavi planından sonra netleşir. Böylece size özel ve doğru bir fiyat verebiliriz. Muayene için randevu talebi oluşturmamı ister misiniz?`,
      chips: [CHIP_BOOK, ...contactChips(clinic)],
    };
  }

  if (service && !has(n, KW.hours) && !has(n, KW.location)) {
    const info = serviceInfo(service);
    return {
      intent: 'service',
      text: `${info ?? `${service.name}: ${service.description}`}\nSize en uygun tedaviyi muayenede hekimimiz belirler. Randevu talebi oluşturmamı ister misiniz?`,
      chips: [{ ...CHIP_BOOK, service: service.name }],
    };
  }

  if (has(n, KW.hours)) return { intent: 'hours', text: hoursText(clinic), chips: [CHIP_BOOK] };

  if (has(n, KW.location)) {
    const chips = [];
    if (clinic.mapsUrl) chips.push({ label: '🗺️ Yol tarifi', href: clinic.mapsUrl });
    return { intent: 'location', text: `Adresimiz: ${clinic.address}`, chips: [...chips, ...contactChips(clinic)] };
  }

  if (has(n, KW.contact)) {
    const parts = [`Telefon: ${clinic.phone}`];
    if (clinic.whatsapp) parts.push(`WhatsApp: +${String(clinic.whatsapp).replace(/\D/g, '')}`);
    if (clinic.email) parts.push(`E-posta: ${clinic.email}`);
    return { intent: 'contact', text: `Bize şuradan ulaşabilirsiniz:\n${parts.map((p) => `• ${p}`).join('\n')}`, chips: contactChips(clinic) };
  }

  if (has(n, KW.doctors)) {
    const docs = clinic.doctors ?? [];
    return {
      intent: 'doctors',
      text: docs.length
        ? `Hekimlerimiz:\n${docs.map((d) => `• ${typeof d === 'string' ? d : `${d.name}${d.title ? ` (${d.title})` : ''}`}`).join('\n')}`
        : 'Alanında deneyimli hekimlerimiz sizi muayene edip size en uygun tedaviyi planlar. Hekimlerimiz hakkında ayrıntılı bilgi için bizi arayabilirsiniz.',
      chips: [CHIP_BOOK],
    };
  }

const __speech = (() => {
// Sesli okuma yardımcıları: metni konuşma motoruna hazırlar ve cihazdaki en doğal sesi seçer.

// Türkçe ses motorları "Ark" kelimesini "arkeoloji" kısaltması sanıp yanlış okuyor.
// Küçük harfli "ark" ise gerçek bir Türkçe kelime olduğu için doğru ("ark") okunuyor.
const DEFAULT_PRONUNCIATIONS = { ARK: 'ark', Ark: 'ark' };

const NOT_WORD = '[^\\p{L}\\p{N}]';

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function detectLang(text) {
  if (/[çğıöşüİ]/i.test(text)) return 'tr';
  if (/\b(the|you|your|and|appointment|hello|thank)\b/i.test(text)) return 'en';
  return 'tr';
}

/**
 * Emoji, bağlantı ve işaretleri temizler; telaffuz sözlüğündeki kelimeleri değiştirir.
 * Sözlük anahtarları büyük/küçük harfe duyarlıdır ve yalnızca tam kelime olarak eşleşir
 * ("Ark'ın" içindeki "Ark" değişir, "Arkadaş" değişmez).
 */
function speechText(text, pronunciations = {}) {
  let out = String(text ?? '')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
    .replace(/[•*#_`>]/g, ' ');
  const dict = { ...DEFAULT_PRONUNCIATIONS, ...(pronunciations ?? {}) };
  for (const [from, to] of Object.entries(dict)) {
    if (!from || from.startsWith('_') || typeof to !== 'string') continue;
    const re = new RegExp(`(^|${NOT_WORD})${escapeRegExp(from)}(?=${NOT_WORD}|$)`, 'gu');
    out = out.replace(re, (_, before) => `${before}${to}`);
  }
  return (
    out
      // Cümle sonundaki "ark." kısaltma gibi okunmasın.
      .replace(new RegExp(`(^|${NOT_WORD})(ark)\\.(?=\\s|$)`, 'giu'), '$1$2!')
      .replace(/\s+/g, ' ')
      .trim()
  );
}

/** Uzun metni parçalara böler (bazı tarayıcılar uzun cümleleri yarıda keser). */
function chunk(text) {
  const parts = text.match(/[^.!?…\n]+[.!?…]*\s*/g) ?? [text];
  const out = [];
  let cur = '';
  for (const p of parts) {
    if ((cur + p).length > 180 && cur) {
      out.push(cur.trim());
      cur = '';
    }
    cur += p;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

/** Bir sesin ne kadar doğal olduğunu tahmin eder (adından ve türünden). null: dil uymuyor. */
function voiceScore(voice, lang) {
  const vlang = String(voice?.lang ?? '').toLowerCase().replace('_', '-');
  if (!vlang.startsWith(lang)) return null;
  const name = String(voice.name ?? '');
  let score = 0;
  if (/natural|neural/i.test(name)) score += 100; // Edge: "Microsoft Emel Online (Natural)"
  if (/premium|enhanced|\bhd\b/i.test(name)) score += 70; // Apple: "Yelda (Gelişmiş)/(Premium)"
  if (/geli[şs]mi[şs]/i.test(name)) score += 70;
  if (/google/i.test(name)) score += 50; // Chrome / Android
  if (/online/i.test(name)) score += 30;
  if (/emel|ahmet|yelda|cem|filiz/i.test(name)) score += 10;
  if (/compact|espeak|eloquence|tolga/i.test(name)) score -= 40; // eski, robotik sesler
  if (voice.localService === false) score += 15; // bulut sesleri genelde daha doğal
  if (vlang === `${lang}-tr` || vlang === `${lang}-us`) score += 5;
  return score;
}

/** Cihazdaki en doğal sesi seçer. `preferred` verilirse adında bu metni içeren ses önce gelir. */
function pickVoice(voices, lang, preferred = '') {
  const list = (voices ?? []).filter((v) => voiceScore(v, lang) !== null);
  if (preferred) {
    const wanted = list.find((v) => v.name.toLocaleLowerCase('tr').includes(preferred.toLocaleLowerCase('tr')));
    if (wanted) return wanted;
  }
  return list.sort((a, b) => voiceScore(b, lang) - voiceScore(a, lang))[0] ?? null;
}

return { DEFAULT_PRONUNCIATIONS, detectLang, speechText, chunk, voiceScore, pickVoice };
})();

// ---------- Sesli okuma (tarayıcının Türkçe sesiyle) ----------
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voices = [];
let soundOn = storage.get('localStorage', 'ark-sound', true);
let speechToken = 0;

if (synth) {
  const load = () => (voices = synth.getVoices());
  load();
  synth.addEventListener?.('voiceschanged', load);
}

/** Metni seslendirir; seslendirme bitince (veya iptal edilince) çözülür. */
function speak(text) {
  const token = ++speechToken;
  if (!synth || !soundOn) return Promise.resolve(false);
  synth.cancel();
  const settings = clinic.speech ?? {};
  const clean = speechText(text, settings.pronunciations);
  if (!clean) return Promise.resolve(false);
  const lang = detectLang(clean);
  const voice = pickVoice(voices, lang, lang === 'tr' ? settings.voice : '');
  const pieces = chunk(clean);
  return new Promise((resolve) => {
    let i = 0;
    let started = false;
    const next = () => {
      if (token !== speechToken) return resolve(started);
      if (i >= pieces.length) return resolve(started);
      const u = new SpeechSynthesisUtterance(pieces[i++]);
      u.lang = voice?.lang ?? (lang === 'tr' ? 'tr-TR' : 'en-US');
      if (voice) u.voice = voice;
      // Doğal konuşma için normal hız ve perde (yüksek perde sesi robotik yapıyor).
      u.rate = Number(settings.rate) || 1;
      u.pitch = Number(settings.pitch) || 1;
      u.onstart = () => {
        started = true;
        if (token === speechToken) mascot.startTalking();
      };
      u.onend = next;
      u.onerror = () => resolve(started);
      synth.speak(u);
    };
    next();
    // Bazı tarayıcılar izin olmadan konuşmaz ve hiçbir olay göndermez; sıradaki sesi de iptal et.
    setTimeout(() => {
      if (!started && token === speechToken) {
        synth.cancel();
        resolve(false);
      }
    }, 1500);
  });
}

function stopSpeaking() {
  speechToken++;
  synth?.cancel();
}

function setSound(on) {
  soundOn = on;
  if (!on) sayToken++;
  storage.set('localStorage', 'ark-sound', on);
  els.sound.setAttribute('aria-pressed', String(on));
  els.sound.title = on ? 'Sesi kapat' : 'Sesi aç';
  els.sound.setAttribute('aria-label', on ? 'Sesli yanıtları kapat' : 'Sesli yanıtları aç');
  if (!on) {
    stopSpeaking();
    mascot.stopTalking();
  }
}

// ---------- Konuşma balonu ----------
let typeTimer = null;
let lastSpoken = '';
let sayToken = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function typeInto(el, text, duration) {
  clearInterval(typeTimer);
  if (reducedMotion) {
    el.textContent = text;
    return;
  }
  const total = text.length;
  const stepMs = 16;
  const perStep = Math.max(1, Math.ceil(total / Math.max(1, duration / stepMs)));
  let shown = 0;
  el.textContent = '';
  typeTimer = setInterval(() => {
    shown = Math.min(total, shown + perStep);
    el.textContent = text.slice(0, shown);
    el.scrollTop = el.scrollHeight;
    if (shown >= total) clearInterval(typeTimer);
  }, stepMs);
}

/** Maskota bir cümle söyletir: balonda yazar, ağzını oynatır, ses açıksa seslendirir. */
async function say(text, { voice = true } = {}) {
  const turn = ++sayToken;
  lastSpoken = text;
  els.bubble.dataset.state = 'text';
  const silentDuration = Math.min(9000, Math.max(1400, text.length * 42));
  typeInto(els.bubbleText, text, Math.min(silentDuration, 3800));
  mascot.startTalking();
  const spoke = voice ? await speak(text) : false;
  if (turn !== sayToken) return; // bu arada yeni bir konuşma başladı
  if (!spoke) {
    await sleep(silentDuration);
    if (turn !== sayToken) return;
  }
  mascot.stopTalking();
}

function think(on) {
  if (on) {
    sayToken++;
    stopSpeaking();
    mascot.stopTalking('thinking');
    mascot.setState('thinking');
    els.bubble.dataset.state = 'thinking';
  } else if (mascot.state === 'thinking') {
    mascot.setState('idle');
  }
}

function chipElement(chip) {
  if (typeof chip === 'string') chip = { label: chip, text: chip };
  if (chip.href) {

    a.textContent = chip.label;
    if (!chip.href.startsWith('tel:')) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
    return a;
  }
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = chip.label;
  b.addEventListener('click', () => {
    greeted = true;
    if (busy) return;

    } else send(chip.text ?? chip.label);

  return b;
}

// ---------- Yapay zeka ----------
function aiHistory() {

    .filter((t) => t.role === 'user' || t.role === 'bot')

    .map((t) => ({ role: t.role === 'user' ? 'user' : 'assistant', content: t.text }));

/** Ara katmanın çalışıp çalışmadığını yapay zekayı çağırmadan kontrol eder. */
async function probeAI(url) {
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{"probe":true}',
      signal: AbortSignal.timeout(8000),
    });
    const data = await res.json().catch(() => null);
    return res.ok && data?.ok === true;
  } catch {
    return false;
  }
}

async function askAI() {
  try {
    const res = await fetch(aiEndpoint, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: aiHistory() }),
      signal: AbortSignal.timeout(40000),
    });
    const data = await res.json().catch(() => null);
    if (res.ok && typeof data?.reply === 'string' && data.reply.trim()) return data.reply.trim();
    if (!data || data.error === 'not_configured') setAI(null);
  } catch {
    /* ağ hatası: hazır cevaba geç */
  }
  return null;
}

function setAI(url) {
  aiEndpoint = url;
  els.status.classList.remove('offline');
  els.status.lastChild.textContent = url ? 'Yapay zeka asistanı · çevrimiçi' : 'Dijital asistan · çevrimiçi';
}

// ---------- Mesaj gönderme ----------
async function send(text) {
  text = String(text ?? '').trim();
  if (!text || busy) return;
  greeted = true;
  els.input.value = '';
  autosize();

  if (flow) {
    addMessage('user', text);
    if (handleFlowText(text)) return;
    // Anlaşılmayan cevapta adımı tekrar sor; başka bir soruysa sihirbazı kapatıp cevapla.
    if (answer(clinic, text).intent === 'unknown' && !priorityAnswer(clinic, text)) {
      repeatStep();
      return;
    }
    endFlow();
  } else {
    addMessage('user', text);
  }
  renderChips([]);

  const priority = priorityAnswer(clinic, text);
  if (priority?.action === 'booking') {
    startBooking(priority.service);
    return;
  }
  if (priority) {
    botSay(priority.text, priority.chips);
    return;
  }

  busy = true;
  els.send.disabled = true;
  const typing = showTyping();
  think(true);
  let reply = null;
  if (aiEndpoint) reply = await askAI();
  if (!reply) await sleep(450); // hazır cevapta da kısa bir "düşünme" anı
  typing.remove();
  think(false);
  busy = false;
  els.send.disabled = false;

  if (reply) {
    const wantsBooking = /\[RANDEVU\]/i.test(reply);
    const clean = reply.replace(/\[RANDEVU\]/gi, '').trim();
    const service = detectService(clinic, text);
    botSay(clean, wantsBooking ? [{ ...CHIP_BOOK, service: service?.name }] : [CHIP_BOOK]);
  } else {
    const result = answer(clinic, text);
    botSay(result.text, result.chips);
  }
}

// ---------- Randevu sihirbazı ----------
function setInputMode(mode) {
  if (mode === 'name') {
    els.input.placeholder = 'Adınız ve soyadınız';
    els.input.setAttribute('inputmode', 'text');
    els.input.setAttribute('autocomplete', 'name');
  } else if (mode === 'phone') {
    els.input.placeholder = 'Telefon, ör. 0532 123 45 67';
    els.input.setAttribute('inputmode', 'tel');
    els.input.setAttribute('autocomplete', 'tel');
  } else {
    els.input.placeholder = DEFAULT_PLACEHOLDER;
    els.input.removeAttribute('inputmode');
    els.input.setAttribute('autocomplete', 'off');
  }
  if (mode && matchMedia('(pointer: fine)').matches) els.input.focus();
}

const cancelChip = { label: 'Vazgeç', onPick: () => cancelFlow() };

function startBooking(service) {

    askDay(`Tabii! ${service} için randevu talebi oluşturalım. Hangi gün size uygun?`);

function askService() {

  botSay('Tabii, hemen randevu talebi oluşturalım! Hangi hizmet için gelmek istersiniz? Emin değilseniz "Muayene ve Kontrol" seçebilirsiniz.', [

    cancelChip,
  ]);
}

function pickService(name) {
  addMessage('user', name);
  flow.req.service = name;
  askDay('Harika! Hangi gün size uygun?');
}

function askDay(text) {
  flow.step = 'day';
  setInputMode(null);
  const days = openDays(clinic, clinicNow(clinic), 8);
  if (!days.length) {
    endFlow();
    botSay(`Önümüzdeki günlerde çevrim içi randevu seçeneği göremedim. Lütfen bizi arayın: ${clinic.phone}`, contactChips());
    return;
  }
  flow.days = days;
  botSay(text, [...days.map((d) => ({ label: d.label, onPick: () => pickDay(d) })), cancelChip]);

function pickDay(day) {
  addMessage('user', day.long);

function askTime() {
  flow.step = 'time';
  const slots = availableSlots(clinic, flow.req.date, clinicNow(clinic));
  flow.slots = slots;
  botSay(`${formatDateTr(flow.req.date)} için hangi saat size uygun? Kesin onayı ekibimiz WhatsApp üzerinden verecek.`, [
    ...slots.map((t) => ({ label: t, onPick: () => pickTime(t) })),
    { label: '← Başka gün', onPick: () => askDay('Hangi gün size uygun?') },
    cancelChip,
  ]);
}

function pickTime(time) {
  addMessage('user', time);
  flow.req.time = time;
  askName();
}

function askName() {
  flow.step = 'name';
  setInputMode('name');
  botSay('Son iki adım! Adınızı ve soyadınızı yazar mısınız?', [cancelChip]);
}

function askPhone() {
  flow.step = 'phone';
  setInputMode('phone');
  botSay('Teşekkürler! Size ulaşabilmemiz için telefon numaranızı yazar mısınız?', [cancelChip]);
}

/** Sihirbaz açıkken yazılan metni işler. true dönerse metin sihirbaza aitti. */
function handleFlowText(text) {
  const n = normalize(text);
  if (/^(vazgec|iptal|cancel|bosver|istemiyorum)/.test(n)) {
    cancelFlow({ echo: false });
    return true;
  }
  if (flow.step === 'name') {
    const name = validName(text);
    if (!name || /\d/.test(text)) {
      botSay('Adınızı ve soyadınızı harflerle yazar mısınız? Örneğin: Ayşe Yılmaz', [cancelChip]);
      return true;
    }
    flow.req.name = name;
    askPhone();
    return true;
  }
  if (flow.step === 'phone') {
    const phone = normalizePhone(text);
    if (!phone) {
      botSay('Telefon numarası geçerli görünmüyor. Örnek: 0532 123 45 67', [cancelChip]);
      return true;
    }
    flow.req.phone = phone;
    showSummary();
    return true;
  }
  if (flow.step === 'service') {
    const service = detectService(clinic, text);
    if (service) {
      flow.req.service = service.name;
      askDay(`${service.name} için hangi gün size uygun?`);
      return true;
    }
    return false;
  }
  if (flow.step === 'day') {
    const words = n.split(' ');
    const matches = flow.days.filter((d) => {
      const label = normalize(`${d.long} ${d.label}`);
      if (words.includes('bugun')) return label.includes('bugun');
      if (words.includes('yarin')) return label.includes('yarin');
      return words.some((w) => w.length >= 3 && ` ${label}`.includes(` ${w}`)) || words.some((w) => /^\d{1,2}$/.test(w) && label.split(' ').includes(w));
    });
    if (matches.length >= 1) {
      // "cuma" gibi birden çok güne uyan cevapta en yakın gün seçilir.
      flow.req.date = matches[0].date;
      askTime();
      return true;
    }
    return false;
  }
  if (flow.step === 'time') {
    const m = /(\d{1,2})(?:[:.](\d{2}))?/.exec(text);
    if (m) {
      const t = `${m[1].padStart(2, '0')}:${m[2] ?? '00'}`;
      if (flow.slots.includes(t)) {
        flow.req.time = t;
        askName();
        return true;
      }
      botSay(`${t} için randevu seçeneği yok. Lütfen listeden bir saat seçin.`, [
        ...flow.slots.map((s) => ({ label: s, onPick: () => pickTime(s) })),
        cancelChip,
      ]);
      return true;
    }
    return false;
  }
  return false;
}

function repeatStep() {
  if (flow.step === 'day') return askDay('Bu günü anlayamadım. Lütfen aşağıdan bir gün seçin ya da "cuma", "yarın" gibi yazın.');
  addMessage('bot', flow.step === 'time' ? 'Bu saati anlayamadım, lütfen listeden seçin.' : 'Bu hizmeti bulamadım, lütfen listeden seçin.', { save: false });
  if (flow.step === 'time') askTime();
  else askService();
}

function endFlow() {
  flow = null;
  setInputMode(null);
}

function cancelFlow({ echo = true } = {}) {
  if (echo) addMessage('user', 'Vazgeç');
  endFlow();
  botSay('Tamam, randevu talebini iptal ettim. Başka bir konuda yardımcı olabilir miyim?', [CHIP_BOOK, ...(clinic.suggestions ?? []).slice(1, 3)]);
}

function contactChips() {
  const chips = [];
  if (clinic.phone) chips.push({ label: '📞 Bizi arayın', href: `tel:${clinic.phone.replace(/[^\d+]/g, '')}` });
  return chips;
}

function summaryCard(req, { save = true } = {}) {
  const card = document.createElement('div');
  card.className = 'appt';
  const title = document.createElement('h4');
  title.textContent = '📋 Randevu talebiniz';
  const dl = document.createElement('dl');
  for (const [k, v] of [
    ['Hizmet', req.service],
    ['Tarih', formatDateTr(req.date)],
    ['Saat', req.time],
    ['Ad Soyad', req.name],
    ['Telefon', req.phone],
  ]) {
    const dt = document.createElement('dt');
    dt.textContent = k;
    const dd = document.createElement('dd');
    dd.textContent = v;
    dl.append(dt, dd);
  }
  card.append(title, dl);
  const actions = document.createElement('div');
  actions.className = 'appt-actions';
  const link = whatsappLink(clinic, req);
  if (link) {
    const a = document.createElement('a');
    a.className = 'wa';
    a.href = link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1a17 17 0 0 1-1.7-.6 13.3 13.3 0 0 1-5.1-4.5c-.4-.5-1-1.5-1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.2.5.1.6 0l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.7-.1 1.4Z"/></svg><span>WhatsApp ile gönder</span>';
    a.addEventListener('click', () => {
      if (!save) return;
      setTimeout(() => {
        mascot.celebrate();
        botSay('Harika! WhatsApp açıldı; mesajı göndermeniz yeterli. Ekibimiz en kısa sürede size dönüş yapacak. Sağlıklı gülüşler! 😁', [
          ...(clinic.suggestions ?? []).slice(1, 3),
        ]);
      }, 300);
    });
    actions.append(a);
  } else {
    const note = document.createElement('p');
    note.className = 'appt-note';
    note.textContent = `Talebinizi iletmek için bizi arayabilirsiniz: ${clinic.phone}`;
    actions.append(note);
    const call = document.createElement('a');
    call.className = 'wa';
    call.href = `tel:${String(clinic.phone ?? '').replace(/[^\d+]/g, '')}`;
    call.textContent = '📞 Bizi arayın';
    actions.append(call);
  }
  card.append(actions);
  els.messages.append(card);
  if (save) remember({ role: 'summary', req });
  scrollDown();
}

function showSummary() {
  const req = { ...flow.req };
  endFlow();
  const hasWa = Boolean(whatsappLink(clinic, req));
  const text = hasWa
    ? 'Bilgileriniz hazır! Aşağıdaki "WhatsApp ile gönder" düğmesine basın; talebiniz kliniğimize iletilsin, ekibimiz uygunluğu onaylasın.'
    : 'Bilgileriniz hazır! Talebinizi iletmek için lütfen bizi arayın.';
  addMessage('bot', text);
  summaryCard(req);
  renderChips([{ label: '✏️ Düzenle', onPick: () => startBooking(req.service) }]);
  say(text);
}

// ---------- Yeni sohbet ve karşılama ----------
function resetChat() {
  sayToken++;
  stopSpeaking();
  mascot.stopTalking();
  endFlow();
  transcript = [];
  storage.remove('sessionStorage', 'ark-transcript');
  els.messages.replaceChildren();
  greet({ voice: true });
}

function welcomeText() {
  return (
    clinic.welcome ??
    `${clinic.shortName ?? clinic.name}'e hoş geldiniz! Ben ${clinic.assistantName}. Sorularınızı yanıtlayabilir, randevu talebinizi hemen oluşturabilirim. Size nasıl yardımcı olayım?`
  );
}

function greet({ voice }) {
  const text = welcomeText();
  addMessage('bot', text);
  renderChips([CHIP_BOOK, ...(clinic.suggestions ?? []).filter((s) => !/randevu/i.test(s))]);
  mascot.wave();
  say(text, { voice });
}

// ---------- Giriş alanı ----------
function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = `${Math.min(els.input.scrollHeight, 140)}px`;
}

els.input.addEventListener('input', autosize);
els.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send(els.input.value);
  }
});
els.form.addEventListener('submit', (e) => {
  e.preventDefault();
  send(els.input.value);
});

els.sound.addEventListener('click', () => setSound(!soundOn));
els.reset.addEventListener('click', resetChat);
els.bubbleSpeak.addEventListener('click', (e) => {
  e.stopPropagation();
  greeted = true;
  if (!soundOn) setSound(true);
  if (lastSpoken) say(lastSpoken);
});

const pokeLines = [
  'Merhaba! 👋 Size nasıl yardımcı olabilirim?',
  'Bugün dişlerinizi fırçaladınız mı? 😄',
  'Randevu almak için bana yazmanız yeterli!',
  'Kaptan Ark göreve hazır! Sorularınızı bekliyorum 🦸',
];
let pokeIndex = 0;
els.mascot.addEventListener('click', () => {
  greeted = true;
  if (busy) return;
  mascot.wave();
  mascot.blink();
  say(pokeLines[pokeIndex++ % pokeLines.length]);
});

// İlk dokunuşta karşılama mesajını sesli oku (tarayıcılar izinsiz ses çalmaya izin vermez).
let greeted = false;
window.addEventListener(
  'pointerdown',
  (e) => {
    if (greeted) return;
    greeted = true;
    if (e.target.closest('#mascot, .chips, .composer button, .chat-head, .bubble-speak, .appt')) return;
    if (soundOn) say(welcomeText());
  },
  { once: true, capture: true },
);

// ---------- Mikrofonla yazma ----------
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Recognition) {
  els.mic.hidden = false;
  let rec = null;
  els.mic.addEventListener('click', () => {
    greeted = true;
    if (rec) {
      rec.stop();
      return;
    }
    sayToken++;
    stopSpeaking();
    mascot.stopTalking();
    rec = new Recognition();
    rec.lang = 'tr-TR';
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    let finalText = '';
    rec.onstart = () => {
      els.mic.classList.add('listening');
      mascot.setState('listening');
      els.bubble.dataset.state = 'text';
      els.bubbleText.textContent = 'Dinliyorum… 👂';
    };
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      els.input.value = (finalText + interim).trim();
      autosize();
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed') addMessage('error', 'Mikrofon izni verilmedi.', { save: false });
    };
    rec.onend = () => {
      els.mic.classList.remove('listening');
      if (mascot.state === 'listening') mascot.setState('idle');
      rec = null;
      if (finalText.trim()) send(finalText);
    };
    rec.start();
  });
}

// ---------- Ses deneme paneli (adresin sonuna ?sesler ekleyin) ----------
function voicePanel() {
  const panel = document.createElement('div');
  panel.className = 'voice-panel';
  const render = () => {
    const list = voices
      .filter((v) => voiceScore(v, 'tr') !== null)
      .sort((a, b) => voiceScore(b, 'tr') - voiceScore(a, 'tr'));
    const chosen = pickVoice(voices, 'tr', clinic.speech?.voice);
    panel.replaceChildren();
    const h = document.createElement('h3');
    h.textContent = 'Bu cihazdaki Türkçe sesler';
    const p = document.createElement('p');
    p.textContent = list.length
      ? 'Dinleyip en doğal bulduğunuz sesin adını ayarlardaki "speech.voice" alanına yazın (adın bir kısmı yeterli, ör. "Emel"). Ziyaretçiler kendi cihazlarındaki en doğal sesi otomatik duyar.'
      : 'Bu tarayıcıda Türkçe ses bulunamadı. Microsoft Edge (Emel/Ahmet "Natural" sesleri) veya Google Chrome deneyin.';
    panel.append(h, p);
    for (const v of list) {
      const row = document.createElement('div');
      row.className = 'voice-row';
      const name = document.createElement('span');
      name.textContent = `${v === chosen ? '✅ ' : ''}${v.name} (${v.lang})${v.localService === false ? ' · bulut' : ''}`;
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = '▶ Dinle';
      b.addEventListener('click', () => {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(speechText(welcomeText(), clinic.speech?.pronunciations));
        u.voice = v;
        u.lang = v.lang;
        u.rate = Number(clinic.speech?.rate) || 1;
        u.pitch = Number(clinic.speech?.pitch) || 1;
        u.onstart = () => mascot.startTalking();
        u.onend = () => mascot.stopTalking();
        synth.speak(u);
      });
      row.append(name, b);
      panel.append(row);
    }
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'voice-close';
    close.textContent = 'Kapat';
    close.addEventListener('click', () => panel.remove());
    panel.append(close);
  };
  render();
  synth?.addEventListener?.('voiceschanged', render);
  document.body.append(panel);
}

// ---------- Başlangıç ----------
async function init() {
  setSound(soundOn);
  mascot.startBlinking();
  setTimeout(() => mascot.state === 'intro' && mascot.setState('idle'), 2000);

  try {
    // Tek dosyalık sürümde ayarlar sayfanın içindeki <script id="clinic-config"> etiketindedir.
    const inline = document.getElementById('clinic-config');
    clinic = inline ? JSON.parse(inline.textContent) : await (await fetch('clinic.json', { cache: 'no-cache' })).json();
  } catch {
    clinic = { name: 'ARK Dental Clinic', shortName: 'ARK Dental', assistantName: 'Kaptan Ark', services: [], suggestions: [] };
  }
  if (clinic.assistantName) els.name.textContent = clinic.assistantName;
  if (clinic.phone) {
    els.call.href = `tel:${clinic.phone.replace(/[^\d+]/g, '')}`;
    els.callText.textContent = clinic.phone;
  }
  setAI(null);
  const endpoint = clinic.ai?.endpoint ? new URL(clinic.ai.endpoint, location.href).href : null;
  if (endpoint) probeAI(endpoint).then((ok) => ok && setAI(endpoint));

  if (params.has('sesler') && synth) voicePanel();

  if (transcript.length) {
    for (const item of transcript) {
      if (item.role === 'summary') summaryCard(item.req, { save: false });
      else addMessage(item.role, item.text, { save: false });
    }
    const lastBot = [...transcript].reverse().find((t) => t.role === 'bot');
    lastSpoken = lastBot?.text ?? welcomeText();
    els.bubbleText.textContent = lastSpoken;
    renderChips([CHIP_BOOK, ...(clinic.suggestions ?? []).filter((s) => !/randevu/i.test(s)).slice(0, 2)]);
    mascot.wave();
  } else {
    // Ses için kullanıcı etkileşimi gerekir; şimdilik sessizce konuşur, ilk dokunuşta sesli okunur.
    const canSpeak = navigator.userActivation?.hasBeenActive ?? false;
    greet({ voice: canSpeak });
  }
}

init();
